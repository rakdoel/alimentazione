<style id="css">
:root{--bg:#f5efe4;--surface:#fffaf2;--surface2:#efe5d4;--ink:#2a221c;--muted:#7b6d60;--line:#e3d6c2;--accent:#b4502c;--accent-soft:#f4ddd0;--olive:#5b7234;--olive-soft:#e2ead0;--ochre:#b9821a;--ochre-soft:#f5e5c2;--red:#a8432e;--red-soft:#f4d9d1;--shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181411;--surface:#221d19;--surface2:#2d2621;--ink:#f1e8db;--muted:#a99a8b;--line:#3a3129;--accent:#e27c52;--accent-soft:#44291e;--olive:#a6c070;--olive-soft:#2b3320;--ochre:#e3b14f;--ochre-soft:#3d2f15;--red:#e67d64;--red-soft:#42231c;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181411;--surface:#221d19;--surface2:#2d2621;--ink:#f1e8db;--muted:#a99a8b;--line:#3a3129;--accent:#e27c52;--accent-soft:#44291e;--olive:#a6c070;--olive-soft:#2b3320;--ochre:#e3b14f;--ochre-soft:#3d2f15;--red:#e67d64;--red-soft:#42231c;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-weight:700;letter-spacing:0;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px}
h3{font-size:20px;margin-bottom:6px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 14px}
.sync{width:10px;height:10px;border-radius:50%;background:var(--olive);flex:none;margin-bottom:8px;transition:background .2s}
.sync.saving{background:var(--ochre)}.sync.err{background:var(--red)}.sync.local{background:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dn-mid{flex:1;text-align:center;min-width:0}
.dn-date{font-size:20px}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 9px;margin-top:2px}
.link{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.score{display:flex;align-items:center;gap:14px}
.score-t{font-weight:700;font-size:17px}
.ring{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:4px 10px;font-size:12.5px}
.chip.out.on{background:var(--accent);border-color:var(--accent);color:#fff}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open].card>summary::after{content:"–"}
details.card p{margin:10px 0 0;font-size:14.5px}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.items{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.it:first-child{border-top:0}
.it-main{flex:1;min-width:0;display:flex;flex-direction:column}
.it-n{font-weight:600}
.it-q{font-size:14px;color:var(--muted)}
.was{font-size:12.5px;color:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface2);color:var(--muted);vertical-align:2px;margin-left:4px}
.tag.ok{background:var(--olive-soft);color:var(--olive)}
.swap{flex:none;min-width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:14px;padding:0 10px}
.swap.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;align-items:center}
.ideas .lab{font-size:12.5px;color:var(--muted);font-weight:600;margin-right:2px}
.idea{border:0;background:var(--ochre-soft);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.adh{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.adh-b{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.adh-b.ok.on{background:var(--olive);border-color:var(--olive);color:#fff}
.adh-b.mid.on{background:var(--ochre);border-color:var(--ochre);color:#fff}
.adh-b.bad.on{background:var(--red);border-color:var(--red);color:#fff}
.free{font-size:14.5px;margin:4px 0 8px}
.lbl{display:block;font-weight:700;font-size:14px;margin:4px 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;margin-bottom:10px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner.todo{background:var(--accent-soft);color:var(--ink)}
.banner.done{background:var(--olive-soft)}
.banner .btn{padding:8px 12px;font-size:13.5px;flex:none}
.wrow{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 0;border-top:1px dashed var(--line);text-align:left}
.wrow:first-child{border-top:0}
.wd{font-weight:700}.wd small{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:99px}
.wp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.flags{grid-column:2/4;font-size:12.5px;color:var(--muted);margin-top:-4px}
.big{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:40px;font-weight:700;line-height:1}
.cols{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--accent);min-height:3px}
.col span{font-size:11px;color:var(--muted);white-space:nowrap}
.col b{font-size:11.5px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rec{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.rec b{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;font-weight:700;display:block}
.rec span{font-size:13.5px;color:var(--muted)}
.kind{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--olive)}
.kind.zuppa{color:var(--ochre)}.kind.contorno{color:var(--accent)}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin-bottom:6px}
ul.ing{padding-left:18px;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:8px 4px;border-top:1px dashed var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;width:38%}
.tbl tr:first-child td{border-top:0}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:14px;font-weight:600}
.vchip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.vchip.static{cursor:default}
.mv{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 0;border-top:1px dashed var(--line)}
.mv:first-child{border-top:0}
.mv-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none;font-size:17px}
.mv-t{flex:1;min-width:0}
.mv-t b{display:block}
.mv-t span{font-size:13.5px;color:var(--muted)}
.prog{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--olive);border-radius:99px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:var(--surface2);border-radius:14px;padding:10px 12px}
.stat b{font-size:22px;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;display:block}
.stat span{font-size:13px;color:var(--muted)}
.lock{text-align:center;padding:26px 16px}
.lock .inp{text-align:center;font-size:24px;letter-spacing:.4em;max-width:220px;margin:8px auto 12px;display:block}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:0;padding:0;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.ph em{position:absolute;right:5px;top:5px;font-style:normal;font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;border-radius:12px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--surface2)}
.cmp figcaption{font-size:13px;text-align:center;margin-top:4px;color:var(--muted)}
.slot{aspect-ratio:3/4;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(20,14,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:600}
.opt b{white-space:nowrap}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.sheet-x{float:right;border:0;background:var(--surface2);border-radius:99px;width:34px;height:34px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}
.splash .serif{font-size:28px}
/* vista nonna */
.nonna{font-size:19px}
.nonna .wrap{padding-bottom:40px}
.n-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0 12px}
.n-h{font-size:28px}
.lang{display:flex;background:var(--surface2);border-radius:12px;padding:3px;flex:none}
.lang button{border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:800;font-size:16px;color:var(--muted)}
.lang button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.n-weeks{display:flex;gap:8px;margin-bottom:12px}
.n-weeks button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:700;font-size:17px}
.n-weeks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.n-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.n-days button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 0;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:15px;line-height:1.15}
.n-days button b{font-size:21px;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif}
.n-days button.today{border-color:var(--accent);color:var(--accent)}
.n-days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.n-day{font-size:26px;margin:0 0 12px}
.n-msg{background:var(--ochre-soft);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:19px}
.n-msg small{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:2px}
.n-meal h2{font-size:23px;margin-bottom:8px}
.n-meal ul{list-style:none;margin:0;padding:0}
.n-meal li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.n-meal li:first-child{border-top:0}
.n-meal li span{font-weight:600}
.n-meal li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.n-meal li em{display:block;font-style:normal;font-size:15px;color:var(--muted);font-weight:500}
.n-out{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:700}
.n-foot{text-align:center;font-size:14px;color:var(--muted);margin-top:16px}
/* v2 */
.g-bg{background:var(--olive-soft)!important}.y-bg{background:var(--ochre-soft)!important}.r-bg{background:var(--red-soft)!important}
.sc{display:inline-block;font-family:inherit;font-size:12.5px;font-weight:800;border-radius:99px;padding:2px 8px;vertical-align:3px;margin-left:6px;background:var(--surface2);color:var(--muted)}
.sc.g{background:var(--olive-soft);color:var(--olive)}.sc.y{background:var(--ochre-soft);color:var(--ochre)}.sc.r{background:var(--red-soft);color:var(--red)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.tlbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.track.lib{grid-template-columns:repeat(3,1fr)}
.tb{border:1.5px solid var(--muted);background:var(--surface2);border-radius:11px;padding:10px 2px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.2}
.tb.on.plan,.tb.on.lib1{background:var(--olive);border-color:var(--olive);color:#fff}
.tb.on.detail,.tb.on.skip,.tb.on.lib2{background:var(--ochre);border-color:var(--ochre);color:#fff}
.tb.on.off,.tb.on.lib3{background:var(--red);border-color:var(--red);color:#fff}
.addx{display:block;width:100%;margin-top:6px;border:1px dashed var(--line);background:none;border-radius:11px;padding:8px;font-size:13.5px;font-weight:700;color:var(--accent)}
.ist{flex:none;border:0;border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:800;background:var(--olive-soft);color:var(--olive)}
.ist.piu,.ist.meno,.ist.no{background:var(--ochre-soft);color:var(--ochre)}.ist.alt{background:var(--red-soft);color:var(--red)}
.xl{list-style:none;margin:8px 0 0;padding:0}
.xl li{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--red-soft);margin-bottom:4px}
.xl li span{flex:1;min-width:0}
.xl li button{border:0;background:none;font-size:18px;color:var(--muted);padding:0 4px}

{id:'minestrone',t:"Minestrone d'autunno con borlotti e orzo",k:'zuppa',m:['borlotti','borlottif','orzo'],v:['Cavolo nero','Verza','Carote','Sedano','Porri','Zucca','Bietole'],when:'Mer cena: Borlotti 150 g + Orzo perlato 40 g (al posto delle Wasa).',ing:['Borlotti: la dose del pasto','Orzo perlato: la dose del pasto','Verdure miste: carota, sedano, cipolla, cavolo nero o verza, zucca','Olio del pasto a crudo','Rosmarino, alloro, una crosta di parmigiano se ce l\'hai (dà sapore, non la mangi)','1 cucchiaio di concentrato di pomodoro'],st:['Taglia le verdure a dadini e mettile in pentola con il concentrato e un dito d\'acqua, 5 minuti.','Aggiungi acqua, alloro, rosmarino e l\'orzo sciacquato. 25 minuti.','Ultimi 10 minuti: borlotti e cavolo nero a striscioline.','Riposo 5 minuti, olio a crudo, pepe.'],tip:'Il giorno dopo è più buono: puoi cuocerne una pentola e porzionare.'},
{id:'mujaddara',t:'Riso e lenticchie con cipolle dorate',k:'unico',m:['lenticchie','riso'],v:['Cipolle'],when:'Lun pranzo: Lenticchie 170 g + Riso basmati 40 g.',ing:['Lenticchie e riso: le dosi del pasto','1 cipolla grande a fettine','Olio del pasto','Cumino, cannella (un pizzico), pepe, sale','Limone e prezzemolo','Insalata o verdure crude per la parte fresca'],st:['Cuoci il riso.','Cipolla in padella antiaderente con metà dell\'olio e un pizzico di sale, fuoco basso 15 minuti: se attacca, un goccio d\'acqua. Deve diventare scura e dolce.','Scalda le lenticchie con cumino e cannella, unisci il riso.','Sopra le cipolle, limone, prezzemolo e il resto dell\'olio.'],tip:'Le cipolle caramellate sono il trucco: tanto sapore, zero grammi in più.'},
{id:'couscous',t:'Couscous speziato con ceci e verdure arrosto',k:'unico',m:['couscous','ceci','cecis'],v:['Zucca','Carote','Peperoni','Zucchine','Cavolfiore','Melanzane'],when:'Ven pranzo: Couscous 50 g + Ceci 150 g. Va bene anche Lun pranzo con couscous 40 g.',ing:['Couscous e ceci: le dosi del pasto','Verdure da forno (zucca, carote, cavolfiore o peperoni)','Olio del pasto','Cumino, curcuma, paprika, cannella','Limone, menta o prezzemolo'],st:['Forno a 220°: verdure a pezzi su carta forno con spezie e sale, 25 minuti. Senza olio.','Couscous in una ciotola con lo stesso peso d\'acqua bollente salata, coperto 5 minuti, poi sgrana con la forchetta.','Ceci scaldati in padella asciutta con un pizzico di cumino.','Unisci tutto, olio a crudo, limone ed erbe.'],tip:'Avanza bene: è buono anche freddo il giorno dopo.'},
{id:'lenticchie',t:'Zuppa di lenticchie, carote e cumino',k:'zuppa',m:['lenticchie'],v:['Carote','Sedano','Cipolle','Spinaci'],when:'Lun pranzo con Lenticchie 170 g, con il pane del pasto.',ing:['Lenticchie: la dose del pasto','2 carote, 1 costa di sedano, mezza cipolla','Olio del pasto a crudo','Cumino, alloro, 1 cucchiaio di concentrato di pomodoro','Pane del pasto tostato'],st:['Soffritto di carota, sedano e cipolla con un goccio d\'acqua e il cumino.','Concentrato, lenticchie, alloro e acqua. 15 minuti.','Frulla una parte per renderla densa. Ultimo minuto: una manciata di spinaci se ne hai.','Olio a crudo e pane tostato.'],tip:'Un filo di succo di limone alla fine la rende viva.'},
{id:'sorrentina',t:'Pasta alla sorrentina leggera',k:'unico',m:['pasta','pastai','mozzp','mozzl'],v:['Pomodori','Melanzane','Zucchine'],when:'Gio cena: Pasta 60 g + Mozzarella proteica 100 g.',ing:['Pasta e mozzarella: le dosi del pasto','Passata o polpa di pomodoro (non si conta, l\'olio sì)','Olio del pasto','Aglio, basilico, origano','Verdure: zucchine o melanzane in padella come contorno'],st:['Sugo: passata, aglio in camicia, sale, 10 minuti. Senza olio.','Scola la pasta al dente e saltala nel sugo.','Fuori dal fuoco aggiungi la mozzarella a cubetti e il basilico: si scioglie e fila.','Olio a crudo sopra.'],tip:'Taglia la mozzarella prima e lasciala scolare: non annacqua il sugo.'},
{id:'pastazucca',t:'Pasta con crema di zucca e ricotta',k:'unico',m:['pasta','pastai','ricotta','parmigiano'],v:['Zucca'],when:'Gio cena con Ricotta 90 g o Parmigiano 30 g al posto della mozzarella.',ing:['Pasta e ricotta (o parmigiano): le dosi del pasto','Zucca: 200–300 g','Olio del pasto','Salvia o rosmarino, noce moscata, pepe'],st:['Zucca a cubetti in padella con acqua e salvia finché è morbida, poi schiacciala o frullala.','Unisci un mestolo d\'acqua di cottura della pasta.','Manteca la pasta con la crema, poi fuori dal fuoco la ricotta.','Olio a crudo, pepe, noce moscata.'],tip:'La zucca arrostita invece che bollita dà una crema più dolce.'},
{id:'ragoseitan',t:'Pasta al ragù di seitan',k:'unico',m:['pasta','pastai','seitan','soias','straccetti'],v:['Carote','Sedano','Cipolle'],when:'Ven cena: Pasta 60 g + Seitan 140 g (o Soia secca 40 g reidratata).',ing:['Pasta e seitan: le dosi del pasto','Carota, sedano, cipolla tritati','Passata di pomodoro','Olio del pasto','Alloro, rosmarino, un goccio di salsa di soia, pepe'],st:['Trita il seitan finissimo (o sbriciolalo con le mani).','Soffritto di verdure con un goccio d\'acqua, poi il seitan finché si colora.','Salsa di soia, passata, alloro: 20 minuti a fuoco basso.','Condisci la pasta e aggiungi l\'olio a crudo.'],tip:'La salsa di soia fa da "carne": un cucchiaino basta.'},
{id:'pizzaiola',t:'Seitan alla pizzaiola',k:'unico',m:['seitan','psteak'],v:['Pomodori','Peperoni'],when:'Ven cena, con la pasta o il pane del pasto per la scarpetta.',ing:['Seitan: la dose del pasto, a fette','Passata o pomodorini','Olio del pasto','Aglio, origano, capperi sciacquati, peperoncino'],st:['Padella con passata, aglio, capperi e origano: 5 minuti.','Adagia le fette di seitan, copri e cuoci 8–10 minuti girandole a metà.','Olio a crudo e altro origano.'],tip:'I capperi danno sapidità senza aggiungere olio.'},
{id:'friedrice',t:'Riso saltato con uova e verdure',k:'unico',m:['riso','uova'],v:['Carote','Zucchine','Porri','Cavolo cappuccio','Verza','Broccoli','Peperoni'],when:'Gio pranzo: Riso basmati 40 g + 2 uova.',ing:['Riso e uova: le dosi del pasto','Verdure a listarelle: carota, porro o cipollotto, verza, zucchina','Olio del pasto','Salsa di soia, zenzero, aglio, peperoncino'],st:['Il riso cotto e raffreddato viene meglio (anche del giorno prima).','Padella antiaderente bollente con metà dell\'olio: verdure 4–5 minuti, devono restare croccanti.','Sposta di lato, rompi le uova e strapazzale, poi unisci il riso.','Salsa di soia, zenzero, il resto dell\'olio a crudo.'],tip:'Fuoco alto e padella larga: le verdure si abbrustoliscono invece di bollire.'},
{id:'tofu',t:'Tofu croccante con soia e zenzero',k:'unico',m:['tofu'],v:['Broccoli','Cavolo cappuccio','Verza','Carote','Zucchine','Spinaci'],when:'Mar pranzo (Tofu 190 g) e Dom pranzo (Tofu 200 g) con riso o pizza del pasto.',ing:['Tofu: la dose del pasto','Olio del pasto','Salsa di soia, zenzero, aglio, un goccio di aceto di riso o limone','Broccoli o verza saltati'],st:['Asciuga bene il tofu: avvolgilo in un canovaccio con un peso sopra per 10 minuti.','Cubetti in padella antiaderente calda con 1 cucchiaino d\'olio, senza toccarli finché non si dorano. Poi girali.','Ultimo minuto: soia, zenzero e aglio, si caramellano.','Verdure saltate a parte, il resto dell\'olio a crudo.'],tip:'Se hai la friggitrice ad aria: 15 minuti a 200° e il tofu diventa croccante senza olio.'},
{id:'frittata',t:'Frittata di verdure al forno',k:'unico',m:['uova'],v:['Zucchine','Spinaci','Cipolle','Porri','Bietole','Carciofi','Peperoni','Funghi','Cavolo nero'],when:'Sab pranzo (3 uova) o Mar cena (3 uova + pizza del pasto).',ing:['Uova: la dose del pasto','Verdure: tante, anche 200–300 g','Olio del pasto','Erbe, pepe, un pizzico di noce moscata'],st:['Cuoci prima le verdure in padella con un goccio d\'acqua e sale.','Sbatti le uova con erbe e pepe, unisci le verdure.','Teglia piccola con carta forno bagnata e strizzata: niente olio per ungere.','Forno a 180° per 18–20 minuti. Olio a crudo sopra.'],tip:'Più verdura metti, più è grande e saziante: le uova restano le stesse.'},
{id:'shakshuka',t:'Shakshuka (uova in purgatorio speziate)',k:'unico',m:['uova','couscous','polenta'],v:['Peperoni','Pomodori','Cipolle','Spinaci'],when:'Mar cena: 3 uova, con Couscous 60 g o Polenta 60 g al posto della pizza.',ing:['Uova: la dose del pasto','Passata o polpa di pomodoro','Peperone e cipolla (o spinaci in inverno)','Olio del pasto','Cumino, paprika, peperoncino, prezzemolo'],st:['Cipolla e peperone in padella con un goccio d\'acqua finché morbidi.','Spezie e passata, 10 minuti.','Fai delle conche e rompi dentro le uova. Coperchio, 6–8 minuti.','Olio a crudo, prezzemolo, e il couscous accanto per raccogliere il sugo.'],tip:'Il cumino tostato un attimo nella padella prima della passata fa la differenza.'},
{id:'polenta',t:'Polenta con funghi trifolati',k:'unico',m:['polenta'],v:['Funghi'],when:'Quando scegli la polenta come carboidrato (Lun pranzo, Mar o Gio cena…).',ing:['Polenta istantanea: la dose del pasto','Funghi: anche 200–300 g','Olio del pasto','Aglio, prezzemolo, timo'],st:['Funghi in padella calda senza olio finché buttano l\'acqua e la riassorbono.','Aglio e timo, sale, 2 minuti.','Polenta morbida come da confezione.','Funghi sopra, olio a crudo e prezzemolo.'],tip:'Con il formaggio del pasto (parmigiano o primosale) diventa una cena completa.'},
{id:'hummus',t:'Hummus con pinzimonio e pizza bianca',k:'unico',m:['hummus','pizzab'],v:['Carote','Finocchi','Sedano','Peperoni','Cetrioli','Radicchio'],when:'Lun pranzo (Hummus 90 g + Pizza bianca 50 g) o Lun cena.',ing:['Hummus e pizza: le dosi del pasto','Verdure crude a bastoncini: carote, finocchi, sedano','Olio del pasto','Paprika, cumino, limone'],st:['Metti l\'hummus nel piatto e fai un solco con il cucchiaio.','Olio nel solco, paprika e cumino sopra, limone.','Verdure crude tutto intorno: è il modo più facile per mangiarne tante.'],tip:'Pizza scaldata un minuto in padella torna croccante.'},
{id:'quinoa',t:'Quinoa tiepida con verdure arrosto e feta',k:'unico',m:['quinoa','feta'],v:['Zucca','Cavolfiore','Broccoli','Barbabietole','Carote','Radicchio'],when:'Dom cena: Quinoa 40 g + Feta 50 g.',ing:['Quinoa e feta: le dosi del pasto','Verdure arrosto (zucca, cavolfiore, barbabietola)','Olio del pasto','Limone, menta o prezzemolo, pepe'],st:['Sciacqua bene la quinoa e cuocila in doppio volume d\'acqua 12–15 minuti.','Verdure in forno a 220° senza olio.','Unisci tutto, feta sbriciolata, olio e limone.'],tip:'La feta è salata: non serve aggiungere sale.'},
{id:'gnocchi',t:'Gnocchi al pomodoro e basilico',k:'unico',m:['gnocchi','gnocchicrudi'],v:['Pomodori','Zucchine','Spinaci'],when:'Gio cena (Gnocchi 120 g + Mozzarella proteica) o Mar cena (Gnocchi 120 g + uova a parte).',ing:['Gnocchi: la dose del pasto','Passata, aglio, basilico','Olio del pasto','Mozzarella proteica se è nel pasto'],st:['Sugo semplice: passata, aglio, sale, 10 minuti.','Gnocchi: appena salgono a galla, scolali.','Saltali nel sugo, mozzarella a cubetti fuori dal fuoco.','Basilico e olio a crudo.'],tip:'Con gli spinaci saltati sopra diventa un piatto unico più grande.'},
{id:'ripassati',t:'Broccoli o cime ripassati aglio e peperoncino',k:'contorno',m:[],v:['Broccoli','Cime di rapa','Cicoria','Bietole','Spinaci','Cavolo nero'],when:'Contorno per qualsiasi pranzo o cena.',ing:['Verdura a foglia o broccoli','Aglio, peperoncino','L\'olio del pasto (anche solo una parte)'],st:['Sbollenta 3–4 minuti in acqua salata e scola.','Padella con aglio, peperoncino e 2 cucchiai d\'acqua di cottura.','Salta la verdura 3 minuti, olio a crudo alla fine.'],tip:'Una spolverata di scorza di limone li rende "da ristorante".'},
{id:'cavolfiore',t:'Cavolfiore arrosto con curcuma e paprika',k:'contorno',m:[],v:['Cavolfiore','Broccoli','Cavolini di Bruxelles'],when:'Contorno, buono anche freddo.',ing:['Cavolfiore a cimette','Curcuma, paprika affumicata, cumino, sale','Limone'],st:['Forno a 220°, ventilato se puoi.','Cimette su carta forno con spezie e sale, senza olio.','25–30 minuti finché i bordi sono bruniti.','Limone e l\'olio del pasto a crudo.'],tip:'Più è bruciacchiato ai bordi, più sa di nocciola.'},
{id:'zuccaforno',t:'Zucca al forno con rosmarino',k:'contorno',m:[],v:['Zucca','Carote','Barbabietole'],when:'Contorno d\'autunno, anche da preparare in anticipo.',ing:['Zucca a spicchi con la buccia (la delica si mangia anche la buccia)','Rosmarino, paprika affumicata, sale, pepe'],st:['Forno a 210°.','Spicchi su carta forno con spezie e rosmarino.','30 minuti, girandoli a metà. Olio a crudo alla fine.'],tip:'Avanzata, frullata con un po\' d\'acqua, diventa subito una vellutata.'},
{id:'finocchi',t:'Finocchi al forno al limone',k:'contorno',m:['parmigiano'],v:['Finocchi','Sedano rapa','Porri'],when:'Contorno. Se nel pasto c\'è il parmigiano, gratinali con quello.',ing:['Finocchi a spicchi','Scorza e succo di limone, pepe, timo','Parmigiano solo se è nella tua dose del pasto'],st:['Sbollenta i finocchi 5 minuti.','Teglia con carta forno, limone, timo, pepe (e parmigiano se è nel pasto).','Forno a 200° per 20 minuti.'],tip:'Anche crudi a fettine sottili con arancia sono ottimi (vedi sotto).'},
{id:'funghi',t:'Funghi trifolati',k:'contorno',m:[],v:['Funghi'],when:'Contorno o condimento per polenta, pane, riso.',ing:['Funghi champignon o misti','Aglio, prezzemolo, timo'],st:['Padella ben calda, funghi senza olio.','Quando hanno buttato e riassorbito l\'acqua: aglio, sale, timo.','Prezzemolo e l\'olio del pasto a crudo.'],tip:'Non salarli all\'inizio: restano più sodi.'},
{id:'chips',t:'Chips di cavolo nero',k:'contorno',m:[],v:['Cavolo nero'],when:'Snack croccante o contorno.',ing:['Cavolo nero senza costa centrale','Sale, paprika, lievito alimentare se il nutrizionista è d\'accordo'],st:['Asciuga benissimo le foglie e spezzettale.','Forno a 150° ventilato, 12–15 minuti: devono seccare, non bruciare.','Sale e spezie a fine cottura.'],tip:'Una nebulizzata dell\'olio del pasto prima del forno le rende più buone.'},
{id:'verza',t:'Verza stufata in agrodolce',k:'contorno',m:[],v:['Verza','Cavolo cappuccio','Radicchio'],when:'Contorno, ottimo con uova o tofu.',ing:['Verza a striscioline','Cipolla','Aceto di mele, un pizzico di cumino o semi di finocchio'],st:['Cipolla e verza in pentola con un dito d\'acqua e sale.','Coperchio, 15–20 minuti a fuoco basso.','Un cucchiaio d\'aceto alla fine, olio del pasto a crudo.'],tip:'L\'aceto alla fine fa sembrare dolce la verza.'},

{id:'arance',t:'Insalata di finocchi e arance',k:'contorno',m:['arance'],v:['Finocchi'],when:'Quando la frutta del pasto è l\'arancia (210 g): la usi qui.',ing:['Finocchi a fette sottili','L\'arancia del pasto a spicchi','Olive (solo se sono nel pasto), pepe, sale'],st:['Affetta il finocchio sottilissimo.','Arancia pelata a vivo, tieni il succo.','Condisci con il succo, pepe e l\'olio del pasto.'],tip:'Classico siciliano, buono da dicembre in poi con le arance di stagione.'},
{id:'radicchio',t:'Radicchio alla piastra con aceto balsamico',k:'contorno',m:[],v:['Radicchio','Cicoria'],when:'Contorno veloce.',ing:['Radicchio a spicchi','Aceto balsamico (poco), sale, pepe'],st:['Piastra o padella antiaderente bollente.','3 minuti per lato.','Poche gocce di balsamico e olio del pasto a crudo.'],tip:'L\'amaro del radicchio con il dolce del balsamico funziona sempre.'},
{id:'forno',t:'Verdure estive al forno',k:'contorno',m:[],v:['Peperoni','Melanzane','Zucchine','Pomodori'],when:'Contorno da fine estate.',ing:['Peperoni, melanzane, zucchine, pomodorini','Origano, aglio, basilico'],st:['Forno a 220°, verdure a pezzi su carta forno con sale e origano.','30 minuti.','Basilico e olio del pasto a crudo.'],tip:'I pomodorini in forno diventano dolcissimi.'},
{id:'pancake',t:'Pancake d\'avena venuti bene',k:'colazione',m:['farav','farorzo','farfarro'],v:[],when:'Mar e Gio colazione.',ing:['Farina d\'avena 50 g (o le alternative 1 volta a settimana)','Albume 125 g','Bevanda d\'avena 60 ml','½–1 cucchiaino di lievito, vaniglia, dolcificante se vuoi'],st:['Mescola tutto e lascia riposare 5 minuti: si addensa.','Padella antiaderente su fuoco medio-basso, velata con carta unta.','Un mestolino per pancake. Giri quando vedi le bollicine.','Nutella sopra alla fine.'],tip:'Cannella e scorza d\'arancia nell\'impasto: sapore in più, calorie zero.'}

leg_polenta:{n:'Polenta ze strączkami w sosie pomidorowym',st:['Patelnia z czosnkiem, rozmarynem i passatą pomidorową: 5 minut.','Dodaj strączki ({P}) i gotuj jeszcze 10 minut, w razie potrzeby z odrobiną wody.','Ugotuj miękką polentę ({C}) według opakowania.','Polenta na talerz, na wierzch sos, obok warzywa z patelni ({V}). Na surowo: {O}.'],tip:'Szczypta chili i liść laurowy w sosie.'},
leg_patate:{n:'Pieczone ziemniaki z chrupiącymi strączkami',st:['Piekarnik 220°. Ziemniaki ({C}) w łódkach na papierze do pieczenia, z rozmarynem i solą, bez oleju.','Po 15 minutach dodaj osuszone strączki ({P}) z papryką i pokrojone warzywa ({V}).','Jeszcze 20 minut, raz przemieszać.','Na koniec na surowo: {O}.'],tip:'Dobrze osusz strączki ściereczką: wtedy będą chrupiące.'},
hum_pinz:{n:'Hummus z surowymi i pieczonymi warzywami',st:['Hummus ({P}) na talerz, zrób łyżką rowek i wlej: {O}. Na wierzch papryka i kmin rzymski.','Połowę warzyw ({V}) pokrój na surowo w słupki.','Drugą połowę piecz w 220° przez 20 minut, bez oleju.','{Cs}'],cs:'Podgrzej na patelni, wróci chrupkość: {C}.',tip:'Kilka kropel cytryny na hummusie i smakuje jak świeży.'},
hum_wrap:{n:'Tortilla lub kanapka z hummusem i grillowanymi warzywami',st:['Grilluj warzywa ({V}) w plastrach na bardzo gorącej patelni grillowej, bez oleju, z solą.','Posmaruj hummusem ({P}): {C}.','Dodaj warzywa, oregano albo miętę i na surowo: {O}. Zawiń.','Podgrzej 1 minutę na patelni.'],tip:'Rukola albo surowa sałata w środku dodają świeżości.'},
hum_bowl:{n:'Miska z kaszą, hummusem i pieczonymi warzywami',st:['Piekarnik 220°: warzywa ({V}) w kawałkach z przyprawami i solą, bez oleju.','Ugotuj: {C}.','Ułóż w misce: na spód {c}, warzywa i dużą łyżkę hummusu ({P}).','Na surowo: {O}, plus cytryna i zioła.'],tip:'Rozrzedź hummus łyżką wody i cytryną: zrobi się sos.'},
tofu_soia:{n:'Chrupiące tofu z sosem sojowym i imbirem, z warzywami z patelni',st:['Dobrze osusz tofu ({P}): zawiń w ściereczkę i przyciśnij czymś ciężkim na 10 minut, potem pokrój w kostkę.','Bardzo gorąca patelnia nieprzywierająca z 1 łyżeczką oleju: kostki bez ruszania, aż się zrumienią, potem obróć.','W ostatniej minucie: łyżka sosu sojowego, imbir i czosnek: ładnie się karmelizują.','Warzywa ({V}) smaż na dużym ogniu 4 minuty, mają zostać chrupiące.','{Cs}','Reszta na surowo: {O}. Sezam tylko jeśli jest w posiłku.'],cs:'Ugotuj i podaj jako spód: {C}.',tip:'W frytkownicy beztłuszczowej: 15 minut w 200°, chrupiące bez oleju.'},
tofu_piastra:{n:'Grillowane tofu lub seitan z warzywami',st:['Pokrój białko ({P}) w plastry i marynuj 10 minut w sosie sojowym z cytryną i papryką.','Bardzo gorąca patelnia grillowa: 3 minuty z każdej strony.','Grilluj warzywa ({V}) w plastrach.','Podgrzej: {C}. Ułóż wszystko, na surowo: {O}.'],tip:'Marynata z soją i cytryną robi całą różnicę.'},
tofu_strap:{n:'Jajecznica z tofu z warzywami',st:['Rozkrusz tofu ({P}) rękami.','Na patelni warzywa ({V}) drobno pokrojone, z odrobiną wody i solą, aż zmiękną.','Dodaj tofu, kurkumę, paprykę, czarny pieprz i 2 łyżki wody: 5 minut, mieszając.','{Cs}','Na surowo: {O}.'],cs:'Obok: {C}.',tip:'Kurkuma robi je żółte jak jajka, czarny pieprz podkręca smak.'},
seit_ragu:{n:'Makaron lub polenta z sosem „bolońskim” z seitana',st:['Posiekaj bardzo drobno seitan ({P}) albo rozkrusz rękami.','Posiekana marchew, seler i cebula na odrobinie wody, potem dodaj seitan i smaż, aż się zarumieni.','Łyżeczka sosu sojowego, passata pomidorowa, liść laurowy: 20 minut na małym ogniu.','Ugotuj: {C}, i polej sosem.','Na surowo: {O}.'],tip:'Sos sojowy udaje „mięso”: wystarczy łyżeczka.'},
seit_pizzaiola:{n:'Seitan w sosie pomidorowym z oregano',st:['Patelnia z passatą pomidorową, czosnkiem, opłukanymi kaparami i oregano: 5 minut.','Połóż seitan w plastrach ({P}), przykryj i duś 8–10 minut, w połowie obróć.','Osobno warzywa ({V}), na patelni albo w piekarniku.','{Cs}','Na surowo: {O}, i jeszcze trochę oregano.'],cs:'Do wycierania sosu: {C}.',tip:'Kapary dają smak bez dodawania oleju.'},
seit_strac:{n:'Paski seitana z warzywami z patelni',st:['Pokrój seitan ({P}) w paski.','Bardzo gorąca patelnia nieprzywierająca z 1 łyżeczką oleju: smaż 4–5 minut.','Dodaj warzywa w paskach ({V}), sos sojowy, imbir i odrobinę wody: 5 minut na dużym ogniu.','{Cs}','Reszta na surowo: {O}, plus cytryna.'],cs:'Podawaj z: {C}.',tip:'Duży ogień i szeroka patelnia: przypieka się, a nie gotuje.'},
uova_frittata:{n:'Omlet z warzywami z piekarnika',st:['Warzywa ({V}) na patelni z odrobiną wody i solą, aż zmiękną.','Roztrzep jajka ({P}) z ziołami, pieprzem i szczyptą gałki muszkatołowej, dodaj warzywa.','Mała forma z papierem do pieczenia zmoczonym i wyciśniętym: bez smarowania olejem.','Piekarnik 180°, 18–20 minut.','{Cs}','Na wierzch na surowo: {O}.'],cs:'Obok: {C}.',tip:'Im więcej warzyw, tym większy i bardziej sycący: jajek tyle samo.'},
uova_shak:{n:'Szakszuka (jajka w sosie pomidorowym)',st:['Cebula i warzywa ({V}) na patelni z odrobiną wody, aż zmiękną.','Podpraż 30 sekund kmin rzymski i paprykę, potem passata pomidorowa: 10 minut.','Zrób dołki i wbij jajka ({P}). Pod przykryciem 6–8 minut.','{Cs}','Na surowo: {O}, plus natka pietruszki albo kolendra.'],cs:'Obok, do wycierania sosu: {C}.',tip:'Sekret: kmin podprażony przed dodaniem passaty.'},
uova_riso:{n:'Smażony ryż z jajkiem i warzywami',st:['Ugotuj: {C}. Jeśli jest z poprzedniego dnia, wyjdzie jeszcze lepiej.','Bardzo gorąca patelnia z połową tłuszczu ({O}): warzywa w paskach ({V}) 4–5 minut, chrupiące.','Przesuń na bok, usmaż jajecznicę z jajek ({P}), potem dodaj ryż.','Sos sojowy, imbir, reszta tłuszczu na surowo.'],tip:'Na koniec świeża dymka, jeśli masz.'},
uova_carbo:{n:'Makaron „carbonara” z warzywami',st:['Pokrój warzywa ({V}) w kostkę i smaż na patelni z odrobiną wody i solą, aż się zrumienią.','Roztrzep jajka ({P}) z dużą ilością pieprzu (parmezan tylko jeśli jest w posiłku).','Ugotuj: {C}. Odcedź, zostaw trochę wody z gotowania, wymieszaj z warzywami.','Zdejmij z ognia, dodaj jajka i odrobinę wody z gotowania, szybko mieszaj: ma być krem, nie jajecznica.','Na surowo: {O}.'],tip:'Poza ogniem i ciągle mieszając: jajka zostają kremowe.'},
uova_patate:{n:'Jajka zapiekane na ziemniakach i warzywach',st:['Piekarnik 210°: cienkie plasterki ({C}) i warzywa ({V}) na papierze do pieczenia, z rozmarynem i solą, 25 minut.','Zrób miejsca i wbij jajka ({P}).','Jeszcze 8–10 minut, aż białko się zetnie.','Na surowo: {O}, i pieprz.'],tip:'Zostaw żółtko miękkie: działa jak sos.'},
form_sorr:{n:'Makaron w sosie pomidorowym z ciągnącym serem',st:['Sos: passata, cały ząbek czosnku, sól, 10 minut, bez oleju.','Ugotuj: {C}, i wymieszaj z sosem.','Zdejmij z ognia, dodaj ser w kostkach ({P}) i bazylię.','Obok warzywa ({V}), z patelni albo z piekarnika.','Na surowo: {O}.'],tip:'Pokrój mozzarellę wcześniej i daj jej odcieknąć: nie rozwodni sosu.'},
form_zucca:{n:'Makaron lub risotto z kremem z dyni i serem',st:['Dynia w kostkę na patelni z wodą i szałwią, aż zmięknie, potem rozgnieć albo zmiksuj.','Ugotuj: {C}, i wymieszaj z kremem i odrobiną wody z gotowania.','Zdejmij z ognia i dodaj ser ({P}).','Na surowo: {O}, plus pieprz i gałka muszkatołowa.'],tip:'Pieczona dynia zamiast gotowanej daje słodszy krem.'},
form_bowl:{n:'Ciepła sałatka z kaszą, pieczonymi warzywami i serem',st:['Piekarnik 220°: warzywa ({V}) w kawałkach z solą i przyprawami, bez oleju, 25 minut.','Ugotuj: {C}.','Wymieszaj wszystko i dodaj ser w kawałkach ({P}).','Na surowo: {O}, plus cytryna, mięta albo natka.'],tip:'Feta jest słona: nie trzeba soli. Do mozzarelli dodaj oregano.'},
form_brus:{n:'Grzanki lub placek z serem i warzywami',st:['Opiecz na patelni albo w tosterze: {C}.','Przygotuj warzywa ({V}): na surowo w cienkich plasterkach albo 3 minuty na patelni.','Rozłóż ser ({P}) i warzywa.','Na surowo: {O}, plus oregano albo bazylia i pieprz.'],tip:'Natrzyj gorący chleb połówką ząbka czosnku.'},
form_polenta:{n:'Polenta z grzybami i serem',st:['Warzywa ({V}) na gorącej patelni bez oleju, aż puszczą wodę i ją wchłoną, potem czosnek i tymianek.','Ugotuj miękką polentę ({C}).','Na wierzch warzywa i ser ({P}).','Na surowo: {O}, i natka pietruszki.'],tip:'Ser na gorącej polencie sam się rozpuści.'},
form_tortino:{n:'Zapiekanka z ziemniaków, warzyw i sera',st:['Ugotuj ziemniaki ({C}) 15 minut, potem pokrój w plastry.','Warzywa ({V}) na patelni z wodą i solą.','Warstwy w formie z papierem do pieczenia: ziemniaki, warzywa, ser ({P}).','Piekarnik 200°, 15 minut. Na surowo: {O}.'],tip:'Pieprz i gałka muszkatołowa między warstwami.'},
leg_panzanella:{n:'Sałatka chlebowa (panzanella)',st:['Pokrój chleb ({C}) w kostkę i opiecz, albo lekko zwilż wodą z octem, jak w Toskanii.','Dodaj warzywa w kawałkach ({V}), czerwoną cebulę w plasterkach i bazylię.','Dodaj: {P}.','Dopraw: {O}, ocet, sól i pieprz. Odstaw na 10 minut przed jedzeniem.'],tip:'Typowe danie letnie: zjeść tego samego dnia.'},
insfredda:{n:'Zimna sałatka z kaszą lub makaronem i grillowanymi warzywami',st:['Ugotuj al dente: {C}. Odcedź i przelej zimną wodą.','Grilluj warzywa ({V}) w plastrach na patelni grillowej bez oleju (ogórek i rukola na surowo).','Dodaj w kawałkach: {P}.','Na surowo: {O}, plus bazylia, cytryna albo ocet, sól i pieprz.'],tip:'Zrobiona wieczorem jest gotowa na obiad poza domem.'},
form_ripiene:{n:'Faszerowane warzywa',st:['Przekrój warzywa ({V}) na pół i lekko wydrąż; miąższ zostaw.','Posiekaj miąższ i wymieszaj z farszem ({P}), rozgniecionym albo w kawałkach, z ziołami i pieprzem.','Napełnij, ułóż w formie z papierem i odrobiną wody na dnie.','Piekarnik 200°, 25–30 minut.','{Cs}','Na surowo: {O}.'],cs:'Obok: {C}.',tip:'Dobre także letnie, następnego dnia.'},
poke:{n:'Miska poke',st:['Ugotuj: {C}, i odstaw do przestudzenia (albo użyj ugotowanego z lodówki).','Przygotuj białko ({P}): tofu w kostkę marynowane 10 minut w sosie sojowym, strączki opłukane, jajka na twardo w ćwiartkach.','Warzywa ({V}) na surowo, w cienkie paski albo plasterki.','Ułóż w misce osobnymi kupkami: kasza, białko, warzywa.','Polej sosem poke albo sojowym. Na surowo: {O}, plus limonka albo cytryna.'],tip:'Świeży starty imbir i dymka: smakuje jak z restauracji.'},
seit_burger:{n:'Burger wegetariański',st:['{Cs}','Burger ({P}) na bardzo gorącej patelni grillowej, 3–4 minuty z każdej strony, z łyżeczką oleju.','Przygotuj warzywa ({V}): sałata, pomidor i cebula w cienkich plasterkach.','Złóż z ketchupem bez cukru i musztardą. Reszta tłuszczu ({O}) na sałatę.'],cs:'{C}: jeśli to bułka, opiecz ją; jeśli ziemniaki, w łódkach w piekarniku 220° przez 30 minut, bez oleju, z rozmarynem i papryką.',tip:'Chrupiące pieczone ziemniaki i ketchup bez cukru: „fast food” zgodny z dietą.'},
leg_polpette:{n:'Kotleciki ze strączków z piekarnika',st:['Rozgnieć widelcem strączki ({P}) z drobno startą marchewką, czosnkiem, natką, kminem rzymskim i solą.','Jeśli masa jest za miękka, włóż ją na 20 minut do lodówki: stężeje bez dodatków.','Uformuj 6–8 kotlecików na papierze do pieczenia i posmaruj połową tłuszczu ({O}).','Piekarnik 200°, 20–25 minut, w połowie obrócić.','Obok warzywa ({V}), na surowo albo z patelni.','{Cs}','Reszta na surowo: {O}.'],cs:'Podawaj z: {C}.',tip:'Wytrzymują 3 dni: zrób podwójną porcję i zabierz do pracy.'},
leg_curry:{n:'Curry z warzywami',st:['Podduś cebulę, czosnek i imbir na 2–3 łyżkach wody.','Podpraż 30 sekund 1 łyżeczkę curry i pół łyżeczki kurkumy.','Dodaj warzywa w kawałkach ({V}), passatę pomidorową i szklankę wody: 15 minut.','Dodaj białko ({P}) i gotuj jeszcze 5–10 minut, aż zgęstnieje.','{Cs}','Na surowo: {O}, plus cytryna, kolendra albo natka.'],cs:'Podawaj z: {C}.',tip:'Następnego dnia jest jeszcze lepsze: warto ugotować podwójnie.'},
leg_chili:{n:'Chili bez mięsa',st:['Cebula, papryka i marchew w kostkę w garnku z odrobiną wody: 5 minut.','Podpraż 30 sekund kmin rzymski, wędzoną paprykę, oregano i chili.','Dodaj passatę pomidorową, warzywa ({V}) i strączki ({P}): 15 minut na małym ogniu.','{Cs}','Na surowo: {O}, plus sok z limonki albo cytryny.'],cs:'Podawaj z: {C}.',tip:'Dobre z fasolą borlotti, białą fasolą i soczewicą. Świetnie się mrozi.'},
leg_insalata:{n:'Sałatka ze strączków z chrupiącymi warzywami',st:['Dobrze opłucz strączki ({P}).','Pokrój warzywa ({V}) i pół czerwonej cebuli w cienkie plasterki: 10 minut w wodzie z octem i cebula robi się słodka.','Dopraw: {O}, cytryna albo ocet, sól, pieprz, natka albo mięta.','{Cs}'],cs:'Dodaj, jako grzanki albo ugotowane i zimne: {C}.',tip:'Obiad do pracy: w słoiku wytrzyma do następnego dnia, doprawić tuż przed jedzeniem.'},
leg_vellutata:{n:'Krem z warzyw z chrupiącymi strączkami',st:['Gotuj warzywa w kawałkach ({V}) z pół cebuli, zalane wodą albo bulionem, 20 minut, potem zmiksuj.','W tym czasie podpraż osuszone strączki ({P}) w piekarniku 200° albo na suchej patelni z papryką, aż będą chrupiące.','Podawaj krem ze strączkami na wierzchu.','{Cs}','Na surowo: {O}.'],cs:'Osobno opieczone: {C}.',tip:'Sam krem wytrzyma 3 dni: chrupiące strączki rób na bieżąco.'},
tofu_spiedini:{n:'Szaszłyki z warzywami z piekarnika',st:['Pokrój białko ({P}) w kostkę i marynuj 15 minut w sosie sojowym z papryką, czosnkiem i cytryną.','Nadziewaj na patyczki na zmianę z kawałkami warzyw ({V}).','Piekarnik 220°, na papierze do pieczenia, 20 minut, w połowie obrócić.','{Cs}','Na surowo: {O}.'],cs:'Obok: {C}.',tip:'Bez patyczków też wyjdzie: wszystko w kawałkach w jednej formie.'},
seit_spezz:{n:'Gulasz z seitana',st:['Obsmaż seitan w kawałkach ({P}) w garnku nieprzywierającym z 1 łyżeczką oleju.','Dodaj cebulę, marchew, seler w kawałkach, warzywa ({V}), liść laurowy i rozmaryn.','Łyżka koncentratu i woda do połowy wysokości: 20 minut pod przykryciem.','{Cs}','Reszta na surowo: {O}.'],cs:'Podawaj z: {C}. Ziemniaki można ugotować od razu w gulaszu.',tip:'Jak każdy gulasz, następnego dnia jest lepszy.'},
seit_fajitas:{n:'Fajitas (tortille z paskami białka i warzyw)',st:['Pokrój w paski białko ({P}) i warzywa ({V}).','Bardzo gorąca patelnia z połową tłuszczu ({O}): najpierw białko, potem warzywa, 6–8 minut.','Wędzona papryka, kmin rzymski, oregano i sok z limonki albo cytryny.','Podgrzej: {C}, i nałóż farsz. Reszta tłuszczu na surowo.'],tip:'Wygląda jak grzeszek, ale wszystko jest zgodne z dietą.'},
uova_muffin:{n:'Muffinki jajeczne z warzywami',st:['Drobno pokrojone warzywa ({V}) na patelni z odrobiną wody i solą.','Roztrzep jajka ({P}) z pieprzem i ziołami, dodaj warzywa.','Wlej do 4–6 silikonowych albo papierowych foremek.','Piekarnik 180°, 18–20 minut.','{Cs}','Na surowo: {O}.'],cs:'Obok: {C}.',tip:'Dobre też na zimno: wygodne na obiad poza domem.'},
uova_insalata:{n:'Sałatka z jajkami na twardo i warzywami',st:['Jajka na twardo: 9 minut od zagotowania wody, potem do zimnej wody.','Ugotuj: {C}, i ostudź (ziemniaki gotuj w kostce).','Dodaj warzywa w kawałkach ({V}) i jajka w ćwiartkach ({P}).','Na surowo: {O}, plus cytryna albo ocet, sól, pieprz, zioła.'],tip:'Jajka na twardo w skorupkach wytrzymają w lodówce 4–5 dni: ugotuj więcej.'},
form_gratin:{n:'Zapiekane warzywa z serem',st:['Obgotuj albo ugotuj na parze warzywa ({V}) przez 8 minut (albo użyj już upieczonych).','Ułóż w naczyniu żaroodpornym, na wierzch ser w kawałkach ({P}), pieprz i gałka muszkatołowa.','Piekarnik 200°, 12–15 minut, aż ser się rozpuści.','{Cs}','Na surowo: {O}.'],cs:'Obok: {C}.',tip:'Z parmezanem robi się skorupka; z ricottą zostaje kremowe.'},
form_greca:{n:'Sałatka grecka',st:['Pokrój warzywa ({V}) w duże kawałki i czerwoną cebulę w plasterki.','Dodaj ser w kostce ({P}).','Oregano, ocet winny albo cytryna. Na surowo: {O}.','{Cs}'],cs:'Z dodatkiem, opieczonym albo ugotowanym i zimnym: {C}.',tip:'Oliwki są poza dietą, chyba że to one są „tłuszczem” tego posiłku.'}
};

/* ---------- ricette riviste per il sapore: soffritti dorati, verdure arrosto in teglia calda, spezie, acidita' finale ---------- */
(function(){
var R={
leg_zuppa:{
 st:[`Trita cipolla e uno spicchio d'aglio e falli appassire in pentola con un cucchiaio d'acqua e un pizzico di sale, a fuoco medio, finché diventano dorati e dolci (5 minuti). Aggiungi un cucchiaio di concentrato di pomodoro e fallo scurire per un minuto.`,`Aggiungi {V} a pezzi, rosmarino, paprika affumicata e {P} sciacquati. Copri con acqua o brodo appena a filo e cuoci 20 minuti.`,`Frulla circa metà della zuppa con il frullatore a immersione e lascia il resto a pezzi: viene cremosa senza panna.`,`Assaggia e aggiusta con sale, pepe e qualche goccia di limone o aceto, che rende il sapore più vivo.`,`{Cs}`,`Servi con {O} a crudo, pepe e i crostini sopra.`],
 tip:`Con un pizzico di paprika affumicata o di cumino la zuppa cambia completamente.`,
 pl:{st:[`Posiekaj cebulę i ząbek czosnku i smaż w garnku z łyżką wody i szczyptą soli na średnim ogniu, aż się zezłocą i będą słodkie (5 minut). Dodaj łyżkę koncentratu pomidorowego i smaż minutę, aż ściemnieje.`,`Dodaj pokrojone warzywa ({V}), rozmaryn, wędzoną paprykę i opłukane strączki ({P}). Zalej wodą albo bulionem tak, żeby ledwo przykryła. Gotuj 20 minut.`,`Zmiksuj blenderem około połowy zupy, resztę zostaw w kawałkach. Będzie kremowa bez śmietany.`,`Spróbuj i dopraw solą, pieprzem i kilkoma kroplami cytryny albo octu. Smak będzie wyraźniejszy.`,`{Cs}`,`Podawaj z pieprzem i grzankami. Na surowo: {O}.`]}},
leg_minestra:{
 st:[`Trita carota, sedano e cipolla e falli soffriggere con un cucchiaio d'acqua e un pizzico di sale finché si dorano. Aggiungi un cucchiaio di concentrato di pomodoro e fallo tostare per un minuto.`,`Aggiungi {V} a pezzetti, un rametto di rosmarino, una foglia d'alloro e acqua (circa 3 volte il volume delle verdure). Porta a bollore.`,`Butta {C} e cuoci il tempo della confezione; a metà cottura aggiungi {P}.`,`Schiaccia qualche legume con la forchetta: la minestra diventa densa e cremosa.`,`Riposo 5 minuti col coperchio, poi {O} a crudo, pepe nero e prezzemolo o origano.`],
 tip:`Più riposa, più è buona: il giorno dopo è ancora meglio.`,
 pl:{st:[`Posiekaj marchew, seler i cebulę i smaż z łyżką wody i szczyptą soli, aż się zezłocą. Dodaj łyżkę koncentratu pomidorowego i smaż minutę.`,`Dodaj drobno pokrojone warzywa ({V}), gałązkę rozmarynu, liść laurowy i wodę (około 3 razy więcej niż warzyw). Doprowadź do wrzenia.`,`Wrzuć: {C}, gotuj tyle, ile podaje opakowanie; w połowie gotowania dodaj: {P}.`,`Rozgnieć widelcem trochę strączków. Zupa będzie gęsta i kremowa.`,`Odstaw na 5 minut pod przykryciem. Na surowo: {O}, do tego czarny pieprz i natka pietruszki albo oregano.`]}},
leg_bowl:{
 st:[`Forno a 220° con la teglia dentro a scaldare. In una ciotola condisci {V} a pezzi con metà dell'olio ({Og}), sale, paprika e cumino, mescolando con le mani. Stendile ben distanziate sulla teglia calda e cuoci 25 minuti, girando a metà, finché sono dorate ai bordi.`,`Cuoci {C}.`,`Scalda {P} in padella asciutta con un pizzico di cumino e un goccio di salsa di soia finché si asciugano e diventano croccanti fuori.`,`Componi la bowl e condisci con il resto dell'olio ({Og}), succo di limone ed erbe fresche.`],
 pl:{st:[`Nagrej piekarnik do 220° razem z blachą. W misce wymieszaj rękami warzywa ({V}) w kawałkach z połową oliwy ({Og}), solą, papryką i kminem rzymskim. Rozłóż na gorącej blasze w odstępach i piecz 25 minut, w połowie obracając, aż się zezłocą na brzegach.`,`Ugotuj: {C}.`,`Podgrzej strączki ({P}) na suchej patelni ze szczyptą kminu i odrobiną sosu sojowego, aż wyschną i będą chrupiące z zewnątrz.`,`Ułóż w misce i polej resztą oliwy ({Og}), sokiem z cytryny i świeżymi ziołami.`]}},
leg_crema:{
 st:[`Frulla {P} con il succo di mezzo limone, mezzo spicchio d'aglio, cumino, sale e acqua fredda a cucchiai, finché è liscia e spumosa. Assaggia: se è piatta aggiungi limone o sale.`,`Metti la crema nel piatto, fai un solco e versaci {O}, poi paprika e prezzemolo sopra.`,`Taglia {V} crude a bastoncini e servile accanto, con un pizzico di sale.`,`{Cs}`],
 pl:{st:[`Zmiksuj strączki ({P}) z sokiem z pół cytryny, pół ząbka czosnku, kminem rzymskim, solą i zimną wodą dodawaną łyżkami, aż będzie gładka i puszysta. Spróbuj: jeśli jest płaska, dodaj cytryny albo soli.`,`Wyłóż pastę na talerz, zrób łyżką rowek i wlej: {O}. Na wierzch papryka i natka pietruszki.`,`Pokrój surowe warzywa ({V}) w słupki i podaj obok, z odrobiną soli.`,`{Cs}`]}},
leg_wrap:{
 st:[`In padella calda fai appassire mezza cipolla a pezzetti con un cucchiaio d'acqua, poi aggiungi aglio, paprika affumicata, cumino e peperoncino per 1 minuto. Unisci la passata e {P}, schiaccia grossolanamente e cuoci 5 minuti finché è denso.`,`Taglia {V} a listarelle sottili, crude con sale e limone oppure saltate 3 minuti a fuoco alto.`,`Scalda {C}.`,`Farcisci con i legumi, le verdure e {O} a crudo, poi una spremuta di limone o lime.`],
 pl:{st:[`Na gorącej patelni zeszklij pół cebuli w kawałkach z łyżką wody, potem dodaj czosnek, wędzoną paprykę, kmin rzymski i chili na 1 minutę. Dodaj passatę i strączki ({P}), grubo rozgnieć i smaż 5 minut, aż zgęstnieje.`,`Pokrój warzywa ({V}) w cienkie paski, na surowo z solą i cytryną albo 3 minuty na dużym ogniu.`,`Podgrzej: {C}.`,`Nałóż strączki, warzywa i na surowo: {O}. Skrop cytryną albo limonką.`]}},
leg_polenta:{
 st:[`In padella con un cucchiaio d'acqua fai dorare aglio e rosmarino, poi aggiungi la passata, sale e peperoncino: 5 minuti.`,`Aggiungi {P} e una foglia d'alloro e cuoci 10 minuti a fuoco basso, schiacciandone qualcuno per addensare.`,`Cuoci {C} morbida come da confezione.`,`Passa {V} in padella calda con un pizzico di sale e uno spicchio d'aglio finché si dorano.`,`Polenta nel piatto, sopra l'umido, accanto le verdure e {O} a crudo.`],
 pl:{st:[`Na patelni z łyżką wody zezłoć czosnek i rozmaryn, potem dodaj passatę, sól i chili: 5 minut.`,`Dodaj strączki ({P}) i liść laurowy i gotuj 10 minut na małym ogniu, rozgniatając kilka dla zgęstnienia.`,`Ugotuj miękką polentę ({C}) według opakowania.`,`Warzywa ({V}) podsmaż na gorącej patelni ze szczyptą soli i ząbkiem czosnku, aż się zezłocą.`,`Polenta na talerz, na wierzch sos, obok warzywa. Na surowo: {O}.`]}},
leg_patate:{
 st:[`Forno a 220° con la teglia dentro. Condisci {C} a spicchi con metà dell'olio ({Og}), rosmarino, sale e paprika, stendili sulla teglia calda e cuoci 15 minuti.`,`Aggiungi {V} a pezzi (con un pizzico di sale e paprika) e {P} ben asciugati con un canovaccio. Altri 20 minuti, girando una volta, finché sono dorati e croccanti.`,`Una spremuta di limone e il resto dell'olio ({Og}) a crudo alla fine.`],
 pl:{st:[`Nagrej piekarnik do 220° razem z blachą. Ziemniaki ({C}) w ćwiartkach wymieszaj z połową oliwy ({Og}), rozmarynem, solą i papryką, rozłóż na gorącej blasze i piecz 15 minut.`,`Dodaj warzywa ({V}) w kawałkach (ze szczyptą soli i papryki) i dobrze osuszone strączki ({P}). Jeszcze 20 minut, raz obrócić, aż będą złote i chrupiące.`,`Na koniec sok z cytryny i reszta oliwy ({Og}) na surowo.`]}},
hum_pinz:{
 st:[`Metti {P} nel piatto, fai un solco con il cucchiaio e versaci {O}, poi paprika, cumino e qualche goccia di limone.`,`Taglia metà di {V} a bastoncini crude.`,`L'altra metà in forno a 220° su teglia calda con sale e paprika, 20–25 minuti, finché è dorata ai bordi.`,`{Cs}`],
 pl:{st:[`Wyłóż hummus ({P}) na talerz, zrób łyżką rowek i wlej: {O}. Na wierzch papryka, kmin rzymski i kilka kropel cytryny.`,`Połowę warzyw ({V}) pokrój na surowo w słupki.`,`Drugą połowę piecz w 220° na gorącej blasze z solą i papryką, 20–25 minut, aż się zezłoci na brzegach.`,`{Cs}`]}},
hum_wrap:{
 st:[`Griglia {V} a fette su una piastra molto calda, 3–4 minuti per lato, finché sono ben segnate. Sale, origano e un goccio di aceto o limone a fine cottura.`,`Spalma {P} su {C}.`,`Aggiungi le verdure, menta o rucola, {O} a crudo e chiudi.`,`Scalda 1 minuto in padella.`],
 pl:{st:[`Grilluj warzywa ({V}) w plastrach na bardzo gorącej patelni grillowej, 3–4 minuty z każdej strony, aż będą wyraźnie przypieczone. Na koniec sól, oregano i odrobina octu albo cytryny.`,`Posmaruj hummusem ({P}): {C}.`,`Dodaj warzywa, miętę lub rukolę i na surowo: {O}. Zawiń.`,`Podgrzej 1 minutę na patelni.`]}},
hum_bowl:{
 st:[`Forno a 220° con la teglia dentro. Condisci {V} a pezzi con metà dell'olio ({Og}), sale, paprika e cumino, stendile sulla teglia calda e cuoci 25 minuti, girando a metà.`,`Cuoci {C}.`,`Componi: base di {c}, verdure, una cucchiaiata grande di {P}.`,`Il resto dell'olio ({Og}), limone ed erbe fresche.`],
 pl:{st:[`Nagrej piekarnik do 220° razem z blachą. Warzywa ({V}) w kawałkach wymieszaj z połową oliwy ({Og}), solą, papryką i kminem rzymskim, rozłóż na gorącej blasze i piecz 25 minut, w połowie obracając.`,`Ugotuj: {C}.`,`Ułóż w misce: na spód {c}, warzywa i duża łyżka hummusu ({P}).`,`Reszta oliwy ({Og}), cytryna i świeże zioła.`]}},
tofu_soia:{
 st:[`Asciuga bene {P}: avvolgilo in un canovaccio con un peso sopra per 10 minuti, poi taglialo a cubetti e condiscilo con un cucchiaio di salsa di soia e un po' di paprika.`,`Padella antiaderente ben calda con 1 cucchiaino del tuo olio: cubetti senza toccarli finché non si dorano (3 minuti), poi girali e dora gli altri lati.`,`Ultimo minuto: un cucchiaio di salsa di soia, zenzero grattugiato, aglio e un goccio di succo di lime, finché si caramella.`,`{V} saltate a fuoco alto 4 minuti con aglio e zenzero, devono restare croccanti.`,`{Cs}`,`Il resto dell'olio ({Og}) a crudo, sesamo solo se è nel pasto.`],
 pl:{st:[`Dobrze osusz tofu ({P}): zawiń w ściereczkę i przyciśnij czymś ciężkim na 10 minut, potem pokrój w kostkę i wymieszaj z łyżką sosu sojowego i odrobiną papryki.`,`Bardzo gorąca patelnia nieprzywierająca z 1 łyżeczką oleju: kostki bez ruszania, aż się zrumienią (3 minuty), potem obróć i zrumień pozostałe strony.`,`W ostatniej minucie: łyżka sosu sojowego, starty imbir, czosnek i odrobina soku z limonki, aż się skarmelizuje.`,`Warzywa ({V}) smaż na dużym ogniu 4 minuty z czosnkiem i imbirem, mają zostać chrupiące.`,`{Cs}`,`Reszta na surowo: {O}. Sezam tylko jeśli jest w posiłku.`]}},
tofu_piastra:{
 st:[`Taglia {P} a fette e marinalo 15 minuti con salsa di soia, succo di limone, paprika, aglio e origano.`,`Piastra molto calda: 3 minuti per lato, finché è ben segnato.`,`Griglia {V} a fette, con sale e una spremuta di limone alla fine.`,`Scalda {C} e componi, con {O} a crudo.`],
 pl:{st:[`Pokrój białko ({P}) w plastry i marynuj 15 minut w sosie sojowym z sokiem z cytryny, papryką, czosnkiem i oregano.`,`Bardzo gorąca patelnia grillowa: 3 minuty z każdej strony, aż będzie wyraźnie przypieczone.`,`Grilluj warzywa ({V}) w plastrach, z solą i odrobiną cytryny na koniec.`,`Podgrzej: {C}. Ułóż wszystko, na surowo: {O}.`]}},
tofu_strap:{
 st:[`Sbriciola {P} con le mani.`,`In padella calda {V} a pezzetti con sale, a fuoco medio-alto, finché si dorano (se si attaccano, un cucchiaio d'acqua).`,`Aggiungi il tofu, curcuma, paprika, pepe nero e un cucchiaio di salsa di soia: 5 minuti mescolando, finché è asciutto e appena dorato.`,`Una spremuta di limone e prezzemolo o erba cipollina.`,`{Cs}`,`{O} a crudo.`],
 pl:{st:[`Rozkrusz tofu ({P}) rękami.`,`Na gorącej patelni warzywa ({V}) drobno pokrojone, z solą, na średnio-dużym ogniu, aż się zezłocą (jeśli się przyklejają, łyżka wody).`,`Dodaj tofu, kurkumę, paprykę, czarny pieprz i łyżkę sosu sojowego: 5 minut mieszając, aż będzie suche i lekko złote.`,`Skrop cytryną i posyp natką pietruszki albo szczypiorkiem.`,`{Cs}`,`Na surowo: {O}.`]}},
seit_ragu:{
 st:[`Trita finissimo {P} (o sbriciolalo con le mani).`,`Soffritto di carota, sedano e cipolla tritati con un cucchiaio d'acqua e un pizzico di sale, finché si dorano. Aggiungi {P} e rosolalo a fuoco vivace 5 minuti finché prende colore.`,`Un cucchiaio di concentrato di pomodoro da scurire un minuto, poi un cucchiaino di salsa di soia, la passata, l'alloro e un pizzico di origano: 20 minuti a fuoco basso, con un goccio d'acqua se si asciuga.`,`Cuoci {C} e condisci con il ragù.`,`{O} a crudo e pepe.`],
 pl:{st:[`Posiekaj bardzo drobno seitan ({P}) albo rozkrusz rękami.`,`Posiekana marchew, seler i cebula z łyżką wody i szczyptą soli, aż się zezłocą. Dodaj seitan i smaż na dużym ogniu 5 minut, aż się zrumieni.`,`Łyżka koncentratu pomidorowego, smażyć minutę, potem łyżeczka sosu sojowego, passata, liść laurowy i szczypta oregano: 20 minut na małym ogniu, w razie potrzeby odrobina wody.`,`Ugotuj: {C}, i polej sosem.`,`Na surowo: {O}, i pieprz.`]}},
seit_pizzaiola:{
 st:[`Rosola {P} a fette in padella antiaderente calda, 2 minuti per lato.`,`Nella stessa padella aglio in camicia, passata, capperi sciacquati e origano: 5 minuti.`,`Rimetti il seitan nel sugo, copri e cuoci 8 minuti, girando a metà.`,`{V} a parte, in padella o al forno.`,`{Cs}`,`{O} a crudo e altro origano.`],
 pl:{st:[`Zrumień seitan ({P}) w plastrach na gorącej patelni nieprzywierającej, po 2 minuty z każdej strony.`,`Na tej samej patelni czosnek w łupinie, passata, opłukane kapary i oregano: 5 minut.`,`Włóż seitan z powrotem do sosu, przykryj i duś 8 minut, w połowie obracając.`,`Osobno warzywa ({V}), na patelni albo w piekarniku.`,`{Cs}`,`Na surowo: {O}, i jeszcze trochę oregano.`]}},
uova_frittata:{
 st:[`Cuoci {V} in padella calda con un pizzico di sale e uno spicchio d'aglio finché sono dorate e asciutte (se si attaccano, un cucchiaio d'acqua).`,`Sbatti {P} con erbe, pepe e un pizzico di noce moscata, unisci le verdure.`,`Teglia piccola con carta forno bagnata e strizzata: niente olio per ungere.`,`Forno a 180° per 18–20 minuti, gli ultimi 2 con il grill per dorare la superficie.`,`{Cs}`,`{O} a crudo sopra.`],
 pl:{st:[`Smaż warzywa ({V}) na gorącej patelni ze szczyptą soli i ząbkiem czosnku, aż się zezłocą i wyschną (jeśli się przyklejają, łyżka wody).`,`Roztrzep jajka ({P}) z ziołami, pieprzem i szczyptą gałki muszkatołowej, dodaj warzywa.`,`Mała forma z papierem do pieczenia zmoczonym i wyciśniętym, bez smarowania olejem.`,`Piekarnik 180°, 18–20 minut, ostatnie 2 z grillem, żeby wierzch się zrumienił.`,`{Cs}`,`Na wierzch na surowo: {O}.`]}},
uova_carbo:{
 st:[`Taglia {V} a dadini e rosolale in padella calda con sale e uno spicchio d'aglio in camicia finché sono ben dorate.`,`Sbatti {P} con pepe abbondante (e il parmigiano solo se è nel pasto).`,`Cuoci {C}, scolala tenendo un po' d'acqua di cottura e saltala con le verdure.`,`Fuori dal fuoco aggiungi le uova e un goccio d'acqua di cottura, mescola veloce: crema, non frittata.`,`{O} a crudo.`],
 pl:{st:[`Pokrój warzywa ({V}) w kostkę i zrumień na gorącej patelni z solą i ząbkiem czosnku w łupinie, aż będą dobrze złote.`,`Roztrzep jajka ({P}) z dużą ilością pieprzu (parmezan tylko jeśli jest w posiłku).`,`Ugotuj: {C}. Odcedź, zostaw trochę wody z gotowania, wymieszaj z warzywami.`,`Zdejmij z ognia, dodaj jajka i odrobinę wody z gotowania, szybko mieszaj: ma być krem, nie jajecznica.`,`Na surowo: {O}.`]}},
uova_patate:{
 st:[`Forno a 210° con la teglia dentro. Condisci {C} a fettine sottili e {V} con metà dell'olio ({Og}), rosmarino, sale e paprika, stendi sulla teglia calda e cuoci 25 minuti, girando a metà.`,`Fai degli spazi e rompi dentro {P}.`,`Altri 8–10 minuti, finché l'albume è rappreso e il tuorlo ancora morbido.`,`Il resto dell'olio ({Og}) a crudo e pepe.`],
 pl:{st:[`Nagrej piekarnik do 210° razem z blachą. Cienkie plasterki ({C}) i warzywa ({V}) wymieszaj z połową oliwy ({Og}), rozmarynem, solą i papryką, rozłóż na gorącej blasze i piecz 25 minut, w połowie obracając.`,`Zrób miejsca i wbij jajka ({P}).`,`Jeszcze 8–10 minut, aż białko się zetnie, a żółtko zostanie miękkie.`,`Reszta oliwy ({Og}) na surowo i pieprz.`]}},
form_sorr:{
 st:[`Sugo: passata, aglio in camicia, sale, basilico e un pizzico di origano. 10 minuti a fuoco medio, finché si restringe e diventa denso.`,`Cuoci {C} al dente e saltala un minuto nel sugo con un mestolo d'acqua di cottura.`,`Fuori dal fuoco aggiungi {P} a cubetti e basilico fresco.`,`{V} accanto, in padella o al forno.`,`{O} a crudo.`],
 pl:{st:[`Sos: passata, ząbek czosnku w łupinie, sól, bazylia i szczypta oregano. 10 minut na średnim ogniu, aż zgęstnieje.`,`Ugotuj: {C} al dente i wymieszaj z sosem na minutę z chochlą wody z gotowania.`,`Zdejmij z ognia, dodaj ser w kostkach ({P}) i świeżą bazylię.`,`Obok warzywa ({V}), z patelni albo z piekarnika.`,`Na surowo: {O}.`]}},
form_zucca:{
 st:[`Forno a 220°: zucca a cubetti su carta forno con sale, pepe e salvia, 20 minuti, finché è morbida e dorata. Schiacciala o frullala con un goccio d'acqua.`,`Cuoci {C} e mantecalo con la crema e un mestolo d'acqua di cottura.`,`Fuori dal fuoco aggiungi {P}.`,`{O} a crudo, pepe, noce moscata.`],
 pl:{st:[`Piekarnik 220°: dynia w kostkę na papierze do pieczenia z solą, pieprzem i szałwią, 20 minut, aż będzie miękka i złota. Rozgnieć albo zmiksuj z odrobiną wody.`,`Ugotuj: {C}, i wymieszaj z kremem i chochlą wody z gotowania.`,`Zdejmij z ognia i dodaj ser ({P}).`,`Na surowo: {O}, plus pieprz i gałka muszkatołowa.`]}},
form_bowl:{
 st:[`Forno a 220° con la teglia dentro. Condisci {V} a pezzi con metà dell'olio ({Og}), sale e spezie, stendile sulla teglia calda e cuoci 25 minuti, girando a metà.`,`Cuoci {C}.`,`Unisci tutto e aggiungi {P} a pezzetti.`,`Il resto dell'olio ({Og}), limone, menta o prezzemolo.`],
 pl:{st:[`Nagrej piekarnik do 220° razem z blachą. Warzywa ({V}) w kawałkach wymieszaj z połową oliwy ({Og}), solą i przyprawami, rozłóż na gorącej blasze i piecz 25 minut, w połowie obracając.`,`Ugotuj: {C}.`,`Wymieszaj wszystko i dodaj ser w kawałkach ({P}).`,`Reszta oliwy ({Og}), cytryna, mięta albo natka.`]}},
form_tortino:{
 st:[`Lessa {C} 15 minuti, poi a fette.`,`{V} in padella calda con aglio e sale finché sono dorate.`,`Strati in una teglia con carta forno: patate, verdure, {P}, con sale, pepe e noce moscata a ogni strato.`,`Forno a 200° per 15 minuti, gli ultimi 2 con il grill. {O} a crudo.`],
 pl:{st:[`Ugotuj ziemniaki ({C}) 15 minut, potem pokrój w plastry.`,`Warzywa ({V}) na gorącej patelni z czosnkiem i solą, aż się zezłocą.`,`Warstwy w formie z papierem do pieczenia: ziemniaki, warzywa, ser ({P}), każdą warstwę posyp solą, pieprzem i gałką muszkatołową.`,`Piekarnik 200°, 15 minut, ostatnie 2 z grillem. Na surowo: {O}.`]}},
form_ripiene:{
 st:[`Taglia a metà {V} e svuotale un po'; tieni la polpa.`,`Trita la polpa e mescolala con {P} schiacciato o a pezzetti, erbe, aglio, sale e pepe.`,`Riempi, metti in teglia con carta forno e un dito d'acqua sul fondo.`,`Forno a 200° per 25–30 minuti, gli ultimi 5 con il grill per dorare.`,`{Cs}`,`{O} a crudo.`],
 pl:{st:[`Przekrój warzywa ({V}) na pół i lekko wydrąż; miąższ zostaw.`,`Posiekaj miąższ i wymieszaj z farszem ({P}), rozgniecionym albo w kawałkach, z ziołami, czosnkiem, solą i pieprzem.`,`Napełnij, ułóż w formie z papierem i odrobiną wody na dnie.`,`Piekarnik 200°, 25–30 minut, ostatnie 5 z grillem, żeby się zrumieniło.`,`{Cs}`,`Na surowo: {O}.`]}},
uova_muffin:{
 st:[`Cuoci {V} a pezzetti in padella calda con sale e aglio finché sono dorate.`,`Sbatti {P} con pepe ed erbe e unisci le verdure.`,`Versa in 4–6 pirottini di silicone o di carta.`,`Forno a 180° per 18–20 minuti.`,`{Cs}`,`{O} a crudo.`],
 pl:{st:[`Drobno pokrojone warzywa ({V}) na gorącej patelni z solą i czosnkiem, aż się zezłocą.`,`Roztrzep jajka ({P}) z pieprzem i ziołami, dodaj warzywa.`,`Wlej do 4–6 silikonowych albo papierowych foremek.`,`Piekarnik 180°, 18–20 minut.`,`{Cs}`,`Na surowo: {O}.`]}},
leg_vellutata:{
 st:[`Fai appassire mezza cipolla con un cucchiaio d'acqua e un pizzico di sale, aggiungi {V} a pezzi e fai insaporire 3 minuti. Copri con acqua o brodo e cuoci 20 minuti, poi frulla con una grattata di noce moscata.`,`Intanto tosta {P} asciugati in forno a 200° o in padella asciutta con paprika, finché sono croccanti.`,`Servi la vellutata con i legumi sopra.`,`{Cs}`,`{O} a crudo e pepe nero.`],
 tip:`Con le verdure arrostite in forno prima di frullarle la vellutata viene più dolce e saporita.`,
